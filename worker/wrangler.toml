name = "secure-chat-worker"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "development"

# Durable Objects binding for chat rooms
[[durable_objects.bindings]]
name = "CHAT_ROOM"
class_name = "ChatRoom"

# KV namespace for session management
[[kv_namespaces]]
binding = "SESSIONS"
id = "xxxx"

# D1 database (optional, for message persistence)
# [[d1_databases]]
# binding = "DB"
# database_name = "secure-chat"
# database_id = "xxxx"

# Secrets (set via wrangler secret put)
# FIREBASE_PROJECT_ID
# FIREBASE_PRIVATE_KEY
# FIREBASE_CLIENT_EMAIL

[dev]
port = 8787
local_protocol = "http"
